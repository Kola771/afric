name: Deploys africastoryline_frontend Project to Ubuntu VPS

on:
  push:
    branches:
      - main 

jobs:
  prepare_environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Debug SSH Key
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::error::La clé SSH privée est vide ou non définie !"
            exit 1
          else
            echo "La clé SSH privée est présente (masquée pour des raisons de sécurité)."
          fi

      - name: Esure target directory exists on VPS
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.SSH_HOST }} 
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            if [ ! -d "/dockerized/containers/africastoryline_frontend_project" ]; then
              mkdir -p /dockerized/containers/africastoryline_frontend_project
            else
              rm -rf /dockerized/containers/africastoryline_frontend_project/*
            fi

      - name: Copy Github files to VPS
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./"
          target: "/dockerized/containers/africastoryline_frontend_project"

      - name: Create .env file
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cat << EOF > /dockerized/containers/africastoryline_frontend_project/.env
            APP_URL=${{ secrets.APP_URL }}
            SERVER_URL=${{ secrets.SERVER_URL }}
            ENVIRONMENT=${{ secrets.ENVIRONMENT }}
            EOF
  
  build_docker_image:
    needs: prepare_environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Build Docker image with commit hash
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export DOCKER_BUILDKIT=1
            cd /dockerized/containers/africastoryline_frontend_project
            docker build -t africastoryline_frontend_project_image .

  stop_and_start_container:
    needs: build_docker_image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Stop and remove old Docker containers
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker stop africastoryline_frontend_project_instance || true
            docker rm africastoryline_frontend_project_instance || true

      - name: Run new Docker container
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker run -d --name africastoryline_frontend_project_instance --restart unless-stopped -p ${{secrets.PORT}}:3000 -v africastoryline_frontend_project_volume:/data africastoryline_frontend_project_image

  clean_up_except_the_latest:
    needs: stop_and_start_container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2


      - name: Clean up previous Docker images except the latest
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Get the latest image ID
            latest_image_id=$(docker images 'africastoryline_frontend_project_image*' --format "{{.ID}}" | head -n1)
            # Remove all images except the latest one
            docker images 'africastoryline_frontend_project_image*' --format "{{.ID}}" | grep -v "$latest_image_id" | xargs --no-run-if-empty docker rmi

      - name: Remove untagged Docker images
        uses: appleboy/ssh-action@v0.1.3
        with:
            host: ${{ secrets.SSH_HOST }}
            username: ${{ secrets.SSH_USERNAME }}
            key: ${{ secrets.SSH_PRIVATE_KEY }}
            script: |
                docker rmi $(docker images -f "dangling=true" -q) || true